<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Select an area</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: crosshair;
        user-select: none;
        font: 12px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #shot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* Everything outside the selection is dimmed by one huge shadow. */
      #sel {
        position: fixed;
        outline: 1px solid #fff;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #sel.empty {
        outline: none;
        inset: 0;
        box-shadow: inset 0 0 0 100vmax rgba(0, 0, 0, 0.35);
      }
      #size {
        position: fixed;
        padding: 2px 6px;
        border-radius: 4px;
        background: #000;
        color: #fff;
        font: 11px 'Cascadia Mono', Consolas, monospace;
        pointer-events: none;
      }
      #size[hidden] {
        display: none;
      }
      #hint {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.16);
        pointer-events: none;
        transition: opacity 160ms ease;
      }
      body.dragging #hint {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="sel" class="empty"></div>
    <div id="size" hidden></div>
    <div id="hint">Drag to select · Esc to cancel</div>
    <script type="module" src="./src/snip.ts"></script>
  </body>
</html>
